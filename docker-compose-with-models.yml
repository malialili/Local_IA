version: '3.8'

# Docker Compose avec pré-téléchargement intégré des modèles
# Ce fichier utilise une image personnalisée avec les modèles pré-chargés
# 
# AVERTISSEMENT: Cette configuration crée une image Docker personnalisée
# avec les modèles intégrés. Cela peut prendre beaucoup de temps et d'espace disque.
# 
# Utilisation:
#   1. Modifiez la liste MODELS_TO_PRELOAD dans le Dockerfile
#   2. Construisez l'image: docker compose -f docker-compose-with-models.yml build
#   3. Lancez: docker compose -f docker-compose-with-models.yml up -d

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - llm_network
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "8080:8080"
    networks:
      - llm_network
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
      - WEBUI_NAME=Local_LLM_IA
    depends_on:
      - ollama

networks:
  llm_network:
    driver: bridge

volumes:
  ollama_data:
  open_webui_data:
