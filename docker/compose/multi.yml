version: '3.8'

# Configuration Multi-Backend : Ollama + LocalAI + LM Studio
# Permet de connecter Open WebUI à plusieurs backends LLM
# Utilisation: docker compose -f docker/compose/multi.yml up -d

services:
  # Ollama - Backend principal
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - llm_network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LocalAI - Alternative open-source
  localai:
    image: go-skynet/local-ai:master
    container_name: localai
    restart: unless-stopped
    volumes:
      - localai_models:/models
    ports:
      - "8081:8080"
    networks:
      - llm_network
    environment:
      - MODELS_PATH=/models
      - DEBUG=true
      - CONTEXT_SIZE=2048
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Open WebUI - Interface unifiée
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "8080:8080"
    networks:
      - llm_network
    environment:
      # Connexion à Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      # Connexion à LocalAI
      - LOCALAI_BASE_URL=http://localai:8080
      # Configuration Open WebUI
      - WEBUI_AUTH=False
      - WEBUI_NAME=Multi_LLM_Interface
      # Activer le multi-backend
      - ENABLE_MULTI_BACKEND=true
    depends_on:
      ollama:
        condition: service_healthy
      localai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  llm_network:
    driver: bridge

volumes:
  ollama_data:
  localai_models:
  open_webui_data:
